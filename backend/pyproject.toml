[project]
name = "news-flow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]==0.29.0",
    "python-dotenv==1.0.1",
    "pydantic-settings==2.2.1",

    "newsapi-python==0.2.7",
    "google-search-results==2.4.2",
    "feedparser==6.0.11",
    "newspaper3k==0.2.8",
    "lxml[html_clean]==5.2.2",
    "httpx==0.27.0",

    "spacy",

    "groq",
    "voyageai",

    "asyncpg",
    "sqlalchemy[asyncio]",
    "qdrant-client==1.9.1",
    "redis==5.0.4",
    "upstash-redis==1.1.0",

    "apscheduler==3.10.4",
    "tenacity==8.3.0",
    "python-dateutil==2.9.0",
    "vaderSentiment",
    "sumy",
    "numpy",
    "requests",
]

[tool.vercel]
entrypoint = ".main:app"